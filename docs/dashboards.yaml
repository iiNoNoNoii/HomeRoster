# Example dashboard configurations for HomeRoster.
# Copy into a Lovelace view (UI editor -> Add card -> "Manual", or a
# view's YAML mode).

# -----------------------------------------------------------------------
# Main family calendar (see the README for all options)
# -----------------------------------------------------------------------
- type: custom:homeroster-card
  title: Family calendar
  entity: calendar.homeroster
  default_view: week
  show_filters: true
  show_search: true
  allow_edit: true
  show_weekends: true
  show_week_numbers: true
  start_hour: 6
  end_hour: 22
  time_step: 30
  color_mode: person
  show_now_line: true

# -----------------------------------------------------------------------
# 1) "Today" tile: count + next events, tap opens the calendar.
#    Uses sensor.homeroster_events_today (state + "events" attribute).
# -----------------------------------------------------------------------
- type: markdown
  title: Today
  content: >-
    {% set today = states.sensor.homeroster_events_today %}
    **{{ today.state }} event(s) today**


    {% for event in (today.attributes.events or [])[:5] %}
    - {% if not event.all_day %}{{ event.start[11:16] }} · {% endif %}{{ event.title }}
    {% endfor %}
  tap_action:
    action: navigate
    navigation_path: /lovelace/family-calendar

# -----------------------------------------------------------------------
# 2) "Next event" tile: title, relative time, people, category icon.
#    Uses the native tile card with sensor.homeroster_next_event
#    (the "timestamp" device class automatically shows a relative time).
# -----------------------------------------------------------------------
- type: tile
  entity: sensor.homeroster_next_event
  name: Next event
  icon: mdi:calendar-clock
  state_content:
    - state
    - last-changed
  # Title/location/people of the next event as a secondary line:
  # (tile cards show a relative time by default for timestamp sensors; for
  # title/location, also use a markdown card like the one below.)

- type: markdown
  content: >-
    {% set next = states.sensor.homeroster_next_event %}
    {% if next.state in ['unknown', 'unavailable'] %}
    No further events planned.
    {% else %}
    **{{ next.attributes.title }}**

    {{ as_timestamp(next.state) | timestamp_custom('%H:%M', true) }}
    {% if next.attributes.location %} · {{ next.attributes.location }}{% endif %}
    {% endif %}

# -----------------------------------------------------------------------
# 3) Person tile: name/color, next event, count of today's events.
#    Tap filters/opens the calendar for this person. Replace "anna" with
#    the real person ID.
# -----------------------------------------------------------------------
- type: markdown
  title: Anna
  content: >-
    {% set today = states('sensor.homeroster_events_today_anna') %}
    {% set next = states.sensor.homeroster_next_event_anna %}
    **{{ today }} event(s) today**

    {% if next.state not in ['unknown', 'unavailable'] %}
    Next event: {{ next.attributes.title }} at
    {{ as_timestamp(next.state) | timestamp_custom('%H:%M', true) }}
    {% else %}
    No further events planned.
    {% endif %}
  tap_action:
    action: navigate
    navigation_path: /lovelace/family-calendar

# -----------------------------------------------------------------------
# Example: active event as a tile (binary_sensor.homeroster_event_active)
# -----------------------------------------------------------------------
- type: tile
  entity: binary_sensor.homeroster_event_active
  name: Event in progress
  icon: mdi:calendar-check
