# Beispiel-Automationen für Family Planner.
# Diese Datei ist zum Kopieren gedacht (Einstellungen -> Automationen ->
# Automation bearbeiten -> YAML-Modus), nicht zum direkten Einbinden.
# Alle Beispiele verwenden ausschließlich Actions/Events, die diese
# Integration tatsächlich bereitstellt (siehe services.yaml und README).

# 1) Morgens um 07:00 Uhr eine Zusammenfassung der heutigen Termine senden.
- alias: "Family Planner - Morgen-Zusammenfassung"
  trigger:
    - trigger: time
      at: "07:00:00"
  action:
    - action: family_planner.get_today_events
      response_variable: heute
    - variables:
        anzahl: "{{ heute.events | count }}"
        liste: >-
          {{ heute.events | map(attribute='title') | list | join(', ') }}
    - action: notify.notify
      data:
        title: "Familienkalender"
        message: >-
          {% if anzahl == 0 %}
            Heute stehen keine Termine an.
          {% else %}
            Heute stehen {{ anzahl }} Termine an: {{ liste }}.
          {% endif %}

# 2) 30 Minuten vor einem Termin einer bestimmten Person benachrichtigen.
#    Voraussetzung: Der Termin hat die Erinnerung "30 Minuten vorher" gesetzt
#    (Termin bearbeiten -> Erinnerungen). Die Integration selbst verschickt
#    keine Benachrichtigungen - sie feuert nur family_planner_reminder_due;
#    das Filtern nach Person und das eigentliche Benachrichtigen übernimmt
#    diese Automation. Ersetze "anna" durch die tatsächliche Personen-ID
#    (siehe Personenverwaltung in der Karte).
- alias: "Family Planner - Erinnerung 30 Minuten vorher (Anna)"
  trigger:
    - trigger: event
      event_type: family_planner_reminder_due
  condition:
    - condition: template
      value_template: "{{ 'anna' in trigger.event.data.person_ids }}"
    - condition: template
      value_template: "{{ trigger.event.data.offset_minutes == 30 }}"
  action:
    - action: notify.notify
      data:
        title: "Gleich geht's los"
        message: "{{ trigger.event.data.title }} beginnt in 30 Minuten."

# 3) Auf neu erstellte oder geänderte Termine reagieren (z. B. Logbuch-Eintrag,
#    Dashboard-Aktualisierung, Sprachausgabe).
- alias: "Family Planner - Auf Terminänderungen reagieren"
  trigger:
    - trigger: event
      event_type: family_planner_event_created
      id: erstellt
    - trigger: event
      event_type: family_planner_event_updated
      id: geaendert
  action:
    - action: logbook.log
      data:
        name: "Familienkalender"
        message: >-
          Termin "{{ trigger.event.data.title }}"
          {{ 'erstellt' if trigger.id == 'erstellt' else 'geändert' }}.

# 4) Beim Start irgendeines Termins kurz eine LED als Hinweis aktivieren.
#    Das family_planner_event_started-Event liefert nur Personen-IDs, keine
#    Farben. Für eine LED in der jeweiligen Personenfarbe lege pro Person
#    einen eigenen input_text-Helfer mit deren Hex-Farbe an (z. B.
#    input_text.person_color_<person_id>) und pflege ihn beim Anlegen der
#    Person einmalig - Home Assistant selbst bietet keine automatische
#    Personen-ID-zu-Farbe-Abfrage außerhalb der Family-Planner-API.
- alias: "Family Planner - LED bei Terminstart"
  trigger:
    - trigger: event
      event_type: family_planner_event_started
  action:
    - action: light.turn_on
      target:
        entity_id: light.buero_led
      data:
        color_name: white

# 5) Terminstatus per Automation auf "erledigt" setzen, sobald ein Termin endet.
- alias: "Family Planner - Automatisch als erledigt markieren"
  trigger:
    - trigger: event
      event_type: family_planner_event_ended
  action:
    - action: family_planner.set_event_status
      data:
        event_id: "{{ trigger.event.data.event_id }}"
        status: done
